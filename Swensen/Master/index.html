<script>(()=>{
    const arrow=document.getElementById('arrow'), page1=document.getElementById('page1'), page2=document.getElementById('page2');
  const timer=document.getElementById('timer'), usedButton=document.getElementById('usedButton'), page2wrap=document.getElementById('page2wrap');
  let dragging=false, opened=false, used=false, startX=0, startLeftPx=0, remaining=2*60*60, timerStarted=false, timerInterval=null;
  let usedSwipeDragging=false, usedSwipeStartX=0;
  const COUPON_KEY='swensen_026C0832D6786_used_v1';
  const storageGet=()=>{try{return localStorage.getItem(COUPON_KEY)}catch(e){return null}};
  const storageSet=v=>{try{localStorage.setItem(COUPON_KEY,v)}catch(e){}};
  const storageRemove=()=>{try{localStorage.removeItem(COUPON_KEY)}catch(e){}};
  function setUsedVisual(){ used=true; usedButton.textContent='USED'; usedButton.disabled=false; usedButton.classList.remove('dragging'); usedButton.classList.add('used-complete'); usedButton.style.setProperty('--swipe-x','7px'); usedButton.setAttribute('aria-label','Swipe right to reactivate coupon'); page2wrap.classList.add('used-state'); timer.textContent='00.00.00'; }
  function restoreUsedState(){if(!storageGet())return false;setUsedVisual();return true;}
  function markUsed(){if(used)return;storageSet('1');if(timerInterval)clearInterval(timerInterval);timerInterval=null;setUsedVisual();}
  function resetToActive(){storageRemove();used=false;page2wrap.classList.remove('used-state');usedButton.textContent='PRESS USED';usedButton.disabled=false;usedButton.classList.remove('used-complete','dragging');usedButton.style.setProperty('--swipe-x','7px');remaining=2*60*60;timerStarted=false;if(timerInterval)clearInterval(timerInterval);timerInterval=null;timer.textContent='02:00:00';startTimer();}
  function startTimer(){if(timerStarted||used)return;timerStarted=true;const tick=()=>{if(used)return;const h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),sec=remaining%60;timer.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');if(remaining>0)remaining--;else{clearInterval(timerInterval);timerInterval=null;timer.textContent='00.00.00';}};tick();timerInterval=setInterval(tick,1000);}
  function openCoupon(){if(opened)return;opened=true;page1.classList.add('hidden');page2.classList.remove('hidden');if(!restoreUsedState())startTimer();}
  arrow.addEventListener('pointerdown',e=>{if(opened)return;dragging=true;startX=e.clientX;startLeftPx=arrow.getBoundingClientRect().left;arrow.classList.add('dragging');arrow.setPointerCapture?.(e.pointerId);e.preventDefault();});
  arrow.addEventListener('pointermove',e=>{if(!dragging||opened)return;const dx=e.clientX-startX,vw=innerWidth;arrow.style.left=Math.max(vw*.045,Math.min(vw*.72,startLeftPx+dx))+'px';e.preventDefault();});
  const finishArrow=e=>{if(!dragging||opened)return;dragging=false;arrow.classList.remove('dragging');const dx=e.clientX-startX;if(dx>=Math.max(80,innerWidth*.25)){arrow.style.left=(innerWidth*.72)+'px';setTimeout(openCoupon,80)}else arrow.style.left='4.5vw';};
  arrow.addEventListener('pointerup',finishArrow);arrow.addEventListener('pointercancel',finishArrow);
  usedButton.addEventListener('pointerdown',e=>{usedSwipeDragging=true;usedSwipeStartX=e.clientX;usedButton.classList.add('dragging');usedButton.setPointerCapture?.(e.pointerId);e.preventDefault();});
  usedButton.addEventListener('pointermove',e=>{if(!usedSwipeDragging)return;const dx=Math.max(0,e.clientX-usedSwipeStartX),maxX=Math.max(7,usedButton.clientWidth-55),x=Math.min(maxX,7+dx);usedButton.style.setProperty('--swipe-x',x+'px');e.preventDefault();});
  const finishUsed=e=>{if(!usedSwipeDragging)return;usedSwipeDragging=false;usedButton.classList.remove('dragging');const dx=e.clientX-usedSwipeStartX;usedButton.style.setProperty('--swipe-x','7px');if(dx>=Math.max(70,usedButton.clientWidth*.45)){if(used)resetToActive();else markUsed();}};
  usedButton.addEventListener('pointerup',finishUsed);usedButton.addEventListener('pointercancel',finishUsed);usedButton.addEventListener('click',e=>e.preventDefault()); 
})();
