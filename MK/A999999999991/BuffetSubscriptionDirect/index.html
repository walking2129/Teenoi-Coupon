const page3Promise = fetch('page3.html').then(function(r){ return r.text(); }).then(function(t){
  const m = t.match(/<img[^>]+src="(data:image\/png;base64,[A-Za-z0-9+/=]+)"/);
  if (!m) throw new Error('Page 3 image not found');
  return m[1];
});


function addOverlay(parent, left, top, width, height) {
  const el = document.createElement('div');
  el.className = 'page3-overlay';
  el.style.left = left + '%';
  el.style.top = top + '%';
  el.style.width = width + '%';
  el.style.height = height + '%';
  parent.appendChild(el);
  return el;
}

function decoratePage3(stage, img) {
  if (!window.jsQR || !window.QRCode) return;

  const W = img.naturalWidth || img.width;
  const H = img.naturalHeight || img.height;
  if (!W || !H) return;

  const maxW = 1800;
  const scale = Math.min(1, maxW / W);
  const cw = Math.max(1, Math.round(W * scale));
  const ch = Math.max(1, Math.round(H * scale));

  const canvas = document.createElement('canvas');
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(img, 0, 0, cw, ch);

  const decoded = window.jsQR(
    ctx.getImageData(0, 0, cw, ch).data,
    cw,
    ch,
    {inversionAttempts:'attemptBoth'}
  );
  if (!decoded || !decoded.location) return;

  const pts = [
    decoded.location.topLeftCorner,
    decoded.location.topRightCorner,
    decoded.location.bottomRightCorner,
    decoded.location.bottomLeftCorner
  ];
  const xs = pts.map(p => p.x / scale);
  const ys = pts.map(p => p.y / scale);

  const qx = Math.min.apply(null, xs);
  const qy = Math.min.apply(null, ys);
  const qrW = Math.max.apply(null, xs) - qx;
  const qrH = Math.max.apply(null, ys) - qy;
  if (!(qrW > 50 && qrH > 50)) return;

  /*
   * Erase a generous white rectangle around the ORIGINAL QR and its
   * gray number. jsQR returns the QR's detected corner area, which can
   * exclude the quiet zone and a little of the artwork around it.
   */
  const eraseX = qx - qrW * 0.10;
  const eraseY = qy - qrH * 0.10;
  const eraseW = qrW * 1.20;
  const eraseH = qrH * 1.42;

  const erase = document.createElement('div');
  erase.className = 'page3-overlay';
  erase.style.left = (eraseX / W * 100) + '%';
  erase.style.top = (eraseY / H * 100) + '%';
  erase.style.width = (eraseW / W * 100) + '%';
  erase.style.height = (eraseH / H * 100) + '%';
  erase.style.background = '#fff';
  erase.style.overflow = 'hidden';
  stage.appendChild(erase);

  /*
   * Draw the replacement QR inside the erased area, with a small white
   * quiet-zone margin. No text/number is drawn below it.
   */
  const qrBox = document.createElement('div');
  qrBox.className = 'page3-overlay';
  const qrSize = Math.min(qrW * 1.02, eraseW * 0.90, eraseH * 0.82);
  const qrLeft = qx + (qrW - qrSize) / 2;
  const qrTop = qy + (qrH - qrSize) / 2;

  qrBox.style.left = (qrLeft / W * 100) + '%';
  qrBox.style.top = (qrTop / H * 100) + '%';
  qrBox.style.width = (qrSize / W * 100) + '%';
  qrBox.style.height = (qrSize / H * 100) + '%';
  qrBox.style.background = '#fff';
  qrBox.style.overflow = 'hidden';
  stage.appendChild(qrBox);

  const qrHost = document.createElement('div');
  qrHost.style.width = '100%';
  qrHost.style.height = '100%';
  qrHost.style.background = '#fff';
  qrHost.style.lineHeight = '0';
  qrBox.appendChild(qrHost);

  new QRCode(qrHost, {
    text: NEW_CODE,
    width: 1000,
    height: 1000,
    colorDark: '#000',
    colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.H
  });

  const qrc = qrHost.querySelector('canvas');
  const qri = qrHost.querySelector('img');
  [qrc, qri].forEach(function(el) {
    if (!el) return;
    el.style.width = '100%';
    el.style.height = '100%';
    el.style.display = 'block';
    el.style.imageRendering = 'pixelated';
  });
}
function showLoading(nextPage, push) {
  const loader = document.createElement('div');
  loader.className = 'loading';
  loader.innerHTML =
    '<div class="spinner"></div>' +
    '<div class="loading-text">กำลังเชื่อมต่อ...</div>';

  document.body.appendChild(loader);

  setTimeout(function() {
    loader.remove();
    render(nextPage, push);
  }, 700);
}

function render(n, push) {
  n = Math.min(3, Math.max(1, Number(n) || 1));
  const app = document.getElementById('app');
  const box = document.createElement('div');
  box.className = 'screen';

  const img = document.createElement('img');
  img.alt = 'MK Buffet Subscription หน้า ' + n;

  if (n === 3) {
    const stage = document.createElement('div');
    stage.className = 'page3-stage';
    stage.appendChild(img);
    box.appendChild(stage);

    page3Promise.then(function(src) {
      img.addEventListener('load', function() {
        try { decoratePage3(stage, img); } catch (_) {}
      }, {once:true});
      img.src = src;
    });
  } else {
    img.src = screens[n];
    box.appendChild(img);
  }

  if (n === 1) {
    const b = document.createElement('button');
    b.id = 'hit1';
    b.className = 'hit';
    b.setAttribute('aria-label', 'เลือก UNLIMITED PACKAGE');
    b.onclick = () => showLoading(2, true);
    box.appendChild(b);
  } else if (n === 2) {
    const b = document.createElement('button');
    b.id = 'hit2';
    b.className = 'hit';
    b.setAttribute('aria-label', 'ใช้แพ็กเกจ');
    b.onclick = () => showLoading(3, true);
    box.appendChild(b);
  }

  app.replaceChildren(box);
  if (push) history.pushState({page:n}, '', '#page' + n);
  window.scrollTo(0,0);
}

window.addEventListener('popstate', function() {
  const m = location.hash.match(/page(\d+)/);
  render(m ? Number(m[1]) : 1, false);
});

const m = location.hash.match(/page(\d+)/);
render(m ? Number(m[1]) : 1, false);
</script>
