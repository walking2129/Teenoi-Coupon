name: Build and publish Kim Auto Buyer updates

on:
  push:
    paths:
      - "KimAutoBuyer/**"
      - ".github/workflows/kim-auto-buyer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          KIM_AUTOBUYER_SIGNING: ${{ secrets.KIM_AUTOBUYER_SIGNING }}
        run: |
          if [ -n "$KIM_AUTOBUYER_SIGNING" ]; then
            python3 - <<'PY'
          import base64, json, os, subprocess, tempfile, zipfile
          from pathlib import Path
          cfg = json.loads(os.environ["KIM_AUTOBUYER_SIGNING"])
          required = ("storePassword", "keyPassword", "keyAlias", "keystoreBase64")
          if any(not cfg.get(name) for name in required):
              raise SystemExit("Signing secret is missing a required field")
          # Mask passwords before later steps can emit their environment.
          print("::add-mask::" + cfg["storePassword"], flush=True)
          print("::add-mask::" + cfg["keyPassword"], flush=True)
          key = base64.b64decode(cfg["keystoreBase64"], validate=True)
          key_path = Path(os.environ["RUNNER_TEMP"]) / "kim-autobuyer-release.jks"
          key_path.write_bytes(key)
          key_path.chmod(0o600)
          os.environ["KIM_STORE_PASSWORD"] = cfg["storePassword"]
          os.environ["KIM_KEY_PASSWORD"] = cfg["keyPassword"]
          # Validate the store password and alias.
          subprocess.run(["keytool", "-list", "-keystore", str(key_path), "-storetype", "JKS",
                          "-storepass:env", "KIM_STORE_PASSWORD", "-alias", cfg["keyAlias"]],
                         check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          # Validate the private-key password by signing a temporary JAR.
          with tempfile.TemporaryDirectory() as tmp:
              jar = Path(tmp) / "probe.jar"
              with zipfile.ZipFile(jar, "w") as archive:
                  archive.writestr("META-INF/MANIFEST.MF", "Manifest-Version: 1.0\n\n")
              signed = Path(tmp) / "probe-signed.jar"
              subprocess.run(["jarsigner", "-keystore", str(key_path), "-storetype", "JKS",
                              "-storepass:env", "KIM_STORE_PASSWORD", "-keypass:env", "KIM_KEY_PASSWORD",
                              "-signedjar", str(signed), str(jar), cfg["keyAlias"]],
                             check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ANDROID_KEYSTORE_PATH={key_path}\n")
              env.write(f"SIGNING_STORE_PASSWORD={cfg['storePassword']}\n")
              env.write(f"SIGNING_KEY_ALIAS={cfg['keyAlias']}\n")
              env.write(f"SIGNING_KEY_PASSWORD={cfg['keyPassword']}\n")
          PY
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KIM_AUTOBUYER_SIGNING is not configured. Building debug APK for compile verification only; no public update will be published."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle --no-daemon -p KimAutoBuyer assembleRelease

      - name: Build debug APK for compile verification
        if: steps.signing.outputs.configured != 'true'
        run: gradle --no-daemon -p KimAutoBuyer assembleDebug

      - name: Publish signed APK and update manifest
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p update-server
          cp KimAutoBuyer/app/build/outputs/apk/release/app-release.apk update-server/KimAutoBuyer.apk
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          metadata_path = Path("KimAutoBuyer/app/build/outputs/apk/release/output-metadata.json")
          metadata = json.loads(metadata_path.read_text())
          element = metadata["elements"][0]
          apk = Path("update-server/KimAutoBuyer.apk")
          manifest = {
              "versionCode": int(element["versionCode"]),
              "versionName": element["versionName"],
              "apkUrl": f"https://walking2129.github.io/Teenoi-Coupon/update-server/KimAutoBuyer.apk?version={element['versionCode']}",
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest()
          }
          Path("update-server/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit update files for GitHub Pages
        if: steps.signing.outputs.configured == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish Kim Auto Buyer update"
          file_pattern: update-server/KimAutoBuyer.apk update-server/latest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KimAutoBuyer-release-or-debug
          path: |
            KimAutoBuyer/app/build/outputs/apk/release/app-release.apk
            KimAutoBuyer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
